<svg viewBox="0 0 500 500" width="500" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sgGoldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="sgHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.1" />
    </linearGradient>
    <filter id="sgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal / Shield luxury frame -->
  <path d="M 250 20 L 450 120 L 450 360 L 250 480 L 50 360 L 50 120 Z" fill="#0F172A" stroke="url(#sgGoldGradient)" stroke-width="16" stroke-linejoin="round" />
  <path d="M 250 38 L 432 129 L 432 349 L 250 458 L 68 349 L 68 129 Z" fill="none" stroke="url(#sgGoldGradient)" stroke-width="3" stroke-dasharray="12 6" opacity="0.6" />

  <!-- Soup Golden Flame / Aroma Vapour at top -->
  <path d="M 250 60 C 242 85 228 105 235 125 C 242 145 258 155 250 175 C 265 155 260 135 252 118 C 245 102 258 80 250 60 Z" fill="url(#sgGoldGradient)" filter="url(#sgGlow)" />

  <!-- Monogram Letter 'S' (Left & Center) -->
  <path d="M 230 155 C 185 155 145 180 145 220 C 145 265 195 275 230 285 C 265 295 285 308 285 335 C 285 365 255 385 215 385 C 175 385 150 365 140 345 L 95 365 C 115 410 160 435 215 435 C 285 435 340 395 340 335 C 340 285 290 270 255 260 C 220 250 200 240 200 218 C 200 195 222 185 250 185 C 280 185 305 200 315 220 L 355 195 C 335 165 290 155 230 155 Z" fill="url(#sgGoldGradient)" />

  <!-- Monogram Letter 'G' (Right & Center Interlocking) -->
  <path d="M 290 235 L 290 278 L 380 278 L 380 345 C 365 365 330 385 290 385 L 290 435 C 355 435 430 395 430 330 L 430 235 Z" fill="url(#sgGoldGradient)" />
  <path d="M 380 195 C 345 165 300 155 250 155 L 250 185 C 290 185 330 195 355 215 Z" fill="url(#sgHighlight)" />

  <!-- Golden Droplets / Rich Broth Accents -->
  <circle cx="250" cy="445" r="8" fill="url(#sgGoldGradient)" />
  <circle cx="105" cy="145" r="5" fill="url(#sgGoldGradient)" opacity="0.8" />
  <circle cx="395" cy="145" r="5" fill="url(#sgGoldGradient)" opacity="0.8" />
</svg>